name: Database Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v2
        with:
          version: 11.1.2

      - run: pnpm install

      - run: pnpm add pg

      - run: pnpm run db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
