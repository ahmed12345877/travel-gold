services:
  - type: web
    name: vanirgroup
    runtime: node
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    # preDeployCommand runs after build but before traffic is served; DB is reachable here.
    # Requires Render Starter plan or higher. Remove if on free tier and run migrations manually.
    preDeployCommand: pnpm run db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
